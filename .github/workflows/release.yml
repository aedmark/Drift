name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach packages to (defaults to the workflow ref name)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches CMakeLists.txt version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "${tag}" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          tag_version="${tag#v}"
          cmake_version="$(grep -oP '^project\(Drift VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          if [ "${tag_version}" != "${cmake_version}" ]; then
            echo "::error::Tag ${tag} (version ${tag_version}) does not match CMakeLists.txt's project version (${cmake_version})"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Check the Arch package version matches too
        shell: bash
        run: |
          pkgver="$(grep -oP '^pkgver=\K.*' packaging/arch/PKGBUILD)"
          if [ "${pkgver}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::packaging/arch/PKGBUILD pkgver=${pkgver} does not match ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check Flatpak release notes exist for this version
        run: python3 scripts/extract_release_notes.py "${{ steps.version.outputs.version }}" release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  package:
    name: Package desktop builds
    permissions:
      contents: read
      actions: write
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      platforms: desktop
      upload_symbols: false
    secrets: inherit

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, package]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release notes
        shell: bash
        run: |
          cp dist/release-notes/release-notes.md notes.md
          cat >> notes.md <<'EOF'

          ## Installing

          - **Linux AppImage** (`x86_64`): `chmod +x Drift-*-x86_64.AppImage && ./Drift-*-x86_64.AppImage`
          - **Windows installer** (`x64`): run `Drift-Setup-*-x64.exe`
          - **Windows portable** (`x64`): extract `Drift-Portable-*-x64.zip` anywhere and run `drift.exe` from the `Drift Mojave` folder inside it. Nothing is installed, though settings and addons are stored per-user under `%APPDATA%\Drift`.
          - **macOS** (Apple Silicon `arm64`): open `Drift-*-arm64.dmg` and drag **Drift Mojave** to Applications. The app is signed ad-hoc rather than notarised, so the first launch needs right-click → Open, or `xattr -dr com.apple.quarantine "/Applications/Drift Mojave.app"`.

          Fonts, stickers, speech models and GPU/CPU acceleration runtimes are not bundled — install the ones you want from the Addon Manager in the app header.
          EOF

      # The in-app updater falls back to this when GitHub's API does not give it an asset digest,
      # and refuses to install a file it has no hash for.
      - name: Write SHA256SUMS
        shell: bash
        run: |
          sha256sum \
            dist/linux-appimage-*/*.AppImage \
            dist/windows-installer-*/*.exe \
            dist/windows-portable-*/*.zip \
            dist/macos-dmg-*/*.dmg \
            | sed -E 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          ASSETS=(
            dist/linux-appimage-*/*.AppImage
            dist/linux-appimage-*/*.AppImage.zsync
            dist/windows-installer-*/*.exe
            dist/windows-portable-*/*.zip
            dist/macos-dmg-*/*.dmg
            SHA256SUMS
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --clobber "${ASSETS[@]}"
            gh release edit "${TAG}" --title "Drift Mojave ${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" --title "Drift Mojave ${TAG}" --notes-file notes.md "${ASSETS[@]}"
          fi
